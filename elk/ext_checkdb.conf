# ---------------------------------------------------------------------------
# ext_checkdb.conf
#
# Chequeo de integridad de bases SQL Server (DBCC CHECKDB) tras un reinicio del servicio SQL,
# leido despues por el agente (sql_integrity.recolectar_elastic, indice `ext_checkdb`).
# Ver docs/PLAN_CHECKDB_POST_REINICIO.md.
#
# La logica (cuando correr, que bases, completo o PHYSICAL_ONLY) vive en ext_checkdb.sql, que se
# edita por hospital. Este .conf solo lo ejecuta y publica el resultado.
#
# COMO DECIDE SI HAY UN REINICIO NUEVO: `use_column_value` + `tracking_column` guardan en
# `last_run_metadata_path` el ultimo `sqlserver_start_epoch` (arranque de SQL en segundos desde
# 1970) que devolvio la consulta. El .sql lo lee como sql_last_value y solo corre el CHECKDB si el
# arranque actual es posterior. Como es numerico y sale del propio SQL, no depende de zonas horarias
# ni de en que VM corra Logstash.
#
# `last_run_metadata_path` PROPIO Y OBLIGATORIO: el valor por defecto (~/.logstash_jdbc_last_run) es
# UN solo archivo por usuario, compartido por todos los pipelines jdbc que corran con ese usuario;
# como este si usa seguimiento, compartirlo pisaria o leeria el valor de otro pipeline.
#
# SIN "schedule =>" A PROPOSITO, igual que el resto de los pipelines de este servidor (ver
# ext_ris_metrics.conf): un ciclo por invocacion, repetido por una Tarea Programada. La
# invocacion es ext_checkdb-all-sito.bat, en su PROPIO cajon (no en ext_tiempo_real-all-sito.bat).
#
# Las filas `BASELINE` (primera corrida) solo siembran el seguimiento y NO se indexan.
#
# RIESGO CONOCIDO: el seguimiento avanza al terminar la consulta, antes de que el output confirme la
# escritura. Si Elastic estuviera caido justo cuando termina un CHECKDB largo, ese resultado podria
# perderse y no se repetiria hasta el proximo reinicio. Mitigacion posible: `queue.type: persisted`
# en el logstash.yml de este pipeline.
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "jdbc:sqlserver://SRVDB-ESTENSA;databaseName=master;user=sa;password=<PASSWORD>;"
    jdbc_user               => "sa"
    jdbc_password           => "<PASSWORD>"
    #jdbc_driver_library    => "C:\ElasticStack\sqljdbc42.jar"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    statement_filepath      => "C:\Estensa\ELK\Configfile\ext_checkdb.sql"

    use_column_value        => true
    tracking_column         => "sqlserver_start_epoch"
    tracking_column_type    => "numeric"
    last_run_metadata_path  => "C:\Estensa\ELK\Configfile\.ext_checkdb_last_run"
  }
}

output {
  if [estado] != "BASELINE" {
    elasticsearch {
      hosts       => ["http://<ELASTIC_HOST>:29200"]   # mismo cluster que usan los demas .conf de este servidor
      user        => "logstash_import"
      password    => "logstash_import"
      index       => "ext_checkdb"
      # Idempotente: un reintento del mismo reinicio pisa el documento en vez de duplicarlo.
      document_id => "%{dbname}_%{sqlserver_start_epoch}"
    }
  }
}

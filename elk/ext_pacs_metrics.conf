# ---------------------------------------------------------------------------
# ext_pacs_metrics.conf
#
# Igual criterio que ext_ris_metrics.conf (ver ese archivo para el detalle
# de por qué la ventana es la última hora cerrada y cómo funciona el
# document_id). Misma lógica que la sub-consulta "pacs" de SQL_QUERY en
# agent_logic.py.
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "<JDBC_CONNECTION_STRING>"   # igual que ext_dicom_queues.conf
    jdbc_user               => "<JDBC_USER>"
    jdbc_password           => "<JDBC_PASSWORD>"
    jdbc_driver_library     => "<JDBC_DRIVER_LIBRARY_PATH>"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    schedule => "5 * * * *"

    statement => "
      DECLARE @EndDate   DATETIME = DATEADD(hour, DATEDIFF(hour, 0, GETDATE()), 0);
      DECLARE @StartDate DATETIME = DATEADD(hour, -1, @EndDate);

      SELECT
          ISNULL([AET], '')          AS aet,
          ISNULL([MOD_IN_STUDY], '') AS mod,
          @StartDate                  AS hour_start,
          COUNT(DISTINCT [STUDY_KEY]) AS almacenados
      FROM [ExtensaPACS].[ExtPacs].[DICOMSTUDIES] WITH(NOLOCK)
      WHERE [LASTUPDATE_DT] >= @StartDate AND [LASTUPDATE_DT] < @EndDate AND ([DELETED] IS NULL OR [DELETED] = '0')
      GROUP BY [AET], [MOD_IN_STUDY]
    "

    use_column_value => false
    tracking_column_type => "timestamp"
  }
}

filter {
  fingerprint {
    source => ["aet", "mod", "hour_start"]
    target => "[@metadata][doc_id]"
    method => "SHA1"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts       => ["http://172.29.232.10:29200"]
    user        => "logstash_import"
    password    => "logstash_import"
    index       => "ext_pacs_metrics_hourly"
    document_id => "%{[@metadata][doc_id]}"
  }
}

# ---------------------------------------------------------------------------
# ext_portal_paciente.conf
#
# Portal paciente (REQ-07, agente 4.5.4): cuantos estudios hay en cada estado de publicacion del
# RIS (tbExamination.PublicationState) y de la cola del MPS (ExtMPS.QUEUE + JOBS), leido despues
# por el agente (portal_paciente.recolectar_elastic, indice `ext_portal_paciente`).
#
# Solo en los hospitales que tienen portal paciente (si ExtensaMPS no existe, el input MPS falla y
# el RIS igual se informa).
#
# Corre cada 5 minutos dentro del cajon ext_tiempo_real-all-sito.bat (misma Tarea Programada que el
# autoenrute DICOM): el servidor dibuja una serie temporal por estado, y con el cajon de 1 hora las
# vistas de 30 min y 1 h tendrian un solo punto. ANTES DE DEJARLO AHI, medir en el hospital cuanto
# tarda (las dos consultas juntas deberian estar en uno o dos segundos); si tarda mucho, pasarlo a
# ext_kpis_negocio-all-sito.bat (cada 1 hora) para no demorar el resto del cajon.
#
# Un documento por estado (`document_id` = origen + codigo): cada corrida pisa el anterior. Los
# estados del catalogo sin estudios salen con total 0 (no desaparecen), asi el grafico baja a cero.
#
# Ventana: ultimos 30 dias (fecha de admision en el RIS, entrada a la cola en el MPS), sin cortar por
# estado. Las fechas salen como TEXTO en hora local del SQL (CONVERT ... 126): si fueran datetime,
# Logstash las pasaria a UTC.
#
# LAS MISMAS CONSULTAS QUE portal_paciente.py (camino SQL directo): si se cambia una, cambiar la otra.
#
# HOST DE CONEXION: copiar el de un .conf que ya funcione en ESTE hospital (en P03 es localhost,
# porque Logstash y SQL Server corren en la misma VM). No dejar un nombre de ejemplo.
#
# !!! ESTE ARCHIVO TIENE DOS BLOQUES jdbc (RIS y MPS): completar host, usuario y password EN LOS
# DOS, y <ELASTIC_HOST> en el output (en H05 es 127.0.0.1:29200). Si un jdbc queda con el
# placeholder, Logstash NO TERMINA NUNCA y cuelga la tarea de 5 min, incluido el autoenrute DICOM
# (paso en H05, 2026-09-30). Al terminar de editar, buscar que no quede ningun "<" fuera de estos
# comentarios (las lineas con #) y correrlo una vez a mano: tiene que mostrar las dos consultas y terminar con "Logstash shut down."
# Guia completa: tecnomonitor-server/docs/guias/19-guia-despliegue-portal-paciente.md
#
# REGLAS PARA EDITAR EL STATEMENT (Logstash procesa este texto antes de mandarlo a SQL Server)
#   - Comentarios SOLO con /* ... */ (nunca con dos guiones).
#   - Sin comillas dobles ni la secuencia "${".
#   - Sin dos puntos.
#
# SIN "schedule =>" A PROPOSITO, igual que el resto de los pipelines de este servidor: un ciclo por
# invocacion, repetido por la Tarea Programada. Sin seguimiento (use_column_value): siempre trae
# el estado completo.
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "jdbc:sqlserver://localhost;databaseName=master;user=sa;password=<PASSWORD>;"
    jdbc_user               => "sa"
    jdbc_password           => "<PASSWORD>"
    #jdbc_driver_library    => "C:\ElasticStack\sqljdbc42.jar"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    statement => "
SET NOCOUNT ON;

/* RIS - estados de publicacion de los examenes admitidos en los ultimos 30 dias */
SELECT 'RIS' AS origin,
       ISNULL(CAST(COALESCE(ps.PublicationState, x.PublicationState) AS VARCHAR(10)), 'NULL') AS code,
       COALESCE(ps.Description,
                CASE WHEN x.PublicationState IS NULL THEN 'Not Ready / In Progress' ELSE 'UNKNOWN' END) AS state,
       ISNULL(x.total, 0) AS total,
       ISNULL(x.last_24h, 0) AS last_24h,
       0 AS pending_iso,
       0 AS with_iso,
       CONVERT(VARCHAR(19), x.oldest, 126) AS oldest,
       CONVERT(VARCHAR(19), GETDATE(), 126) AS checked_at
FROM [ExtensaRadio].[ExtRadio].[dsPublicationState] ps WITH (NOLOCK)
FULL OUTER JOIN (
    SELECT e.PublicationState,
           COUNT(*) AS total,
           COUNT(CASE WHEN e.AdmissionDate >= DATEADD(HOUR, -24, GETDATE()) THEN 1 END) AS last_24h,
           MIN(e.AdmissionDate) AS oldest
    FROM [ExtensaRadio].[ExtRadio].[tbExamination] e WITH (NOLOCK)
    WHERE e.AdmissionDate >= DATEADD(DAY, -30, GETDATE())
    GROUP BY e.PublicationState
) x ON x.PublicationState = ps.PublicationState;
"
  }

  jdbc {
    jdbc_connection_string => "jdbc:sqlserver://localhost;databaseName=master;user=sa;password=<PASSWORD>;"
    jdbc_user               => "sa"
    jdbc_password           => "<PASSWORD>"
    #jdbc_driver_library    => "C:\ElasticStack\sqljdbc42.jar"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    statement => "
SET NOCOUNT ON;

/* MPS - cola de generacion de ISO de los ultimos 30 dias, con todos los estados del catalogo */
SELECT 'MPS' AS origin,
       ISNULL(CAST(COALESCE(s.STATUS_ID, x.STATUS_ID) AS VARCHAR(10)), 'NULL') AS code,
       ISNULL(s.DESCRIPTION, 'UNKNOWN') AS state,
       ISNULL(x.total, 0) AS total,
       ISNULL(x.last_24h, 0) AS last_24h,
       ISNULL(x.pending_iso, 0) AS pending_iso,
       ISNULL(x.with_iso, 0) AS with_iso,
       CONVERT(VARCHAR(19), x.oldest, 126) AS oldest,
       CONVERT(VARCHAR(19), GETDATE(), 126) AS checked_at
FROM [ExtensaMPS].[ExtMPS].[LS_STATUS_CODES] s WITH (NOLOCK)
FULL OUTER JOIN (
    SELECT q.STATUS_ID,
           COUNT(*) AS total,
           COUNT(CASE WHEN q.IN_TIME >= DATEADD(HOUR, -24, GETDATE()) THEN 1 END) AS last_24h,
           COUNT(CASE WHEN j.MEDIA_ACTUAL_SIZE IS NULL THEN 1 END) AS pending_iso,
           COUNT(CASE WHEN j.MEDIA_ACTUAL_SIZE IS NOT NULL THEN 1 END) AS with_iso,
           MIN(q.IN_TIME) AS oldest
    FROM [ExtensaMPS].[ExtMPS].[QUEUE] q WITH (NOLOCK)
    INNER JOIN [ExtensaMPS].[ExtMPS].[JOBS] j WITH (NOLOCK) ON j.ID = q.JOB_ID
    WHERE q.IN_TIME >= DATEADD(DAY, -30, GETDATE())
    GROUP BY q.STATUS_ID
) x ON x.STATUS_ID = s.STATUS_ID;
"
  }
}

output {
  elasticsearch {
    hosts       => ["http://<ELASTIC_HOST>:29200"]   # mismo cluster que usan los demas .conf de este servidor
    user        => "logstash_import"
    password    => "logstash_import"
    index       => "ext_portal_paciente"
    # Un documento por estado (RIS_4, MPS_1, ...): cada corrida pisa el estado anterior.
    document_id => "%{origin}_%{code}"
  }
}

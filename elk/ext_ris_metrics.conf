# ---------------------------------------------------------------------------
# ext_ris_metrics.conf
#
# Calcula, cada hora, los mismos contadores por equipo/AET/modalidad que hoy
# calcula el agente directo contra SQL Server (ver SQL_QUERY en
# agent_logic.py — esta es la misma lógica de CASE/SUM/GROUP BY, solo que acá
# corre sobre una ventana fija de 1 hora en vez del bloque configurable del
# agente). El agente reconstruye sus bloques (ej. 8hs) sumando varios
# documentos horarios de acá — ver docs/ELK_RIS_METRICS.md.
#
# IMPORTANTE: procesa siempre la ÚLTIMA HORA YA CERRADA, nunca la hora en
# curso — si corriera sobre la hora actual, el bloque quedaría parcial y el
# agente contaría esos estudios dos veces (una parcial acá, otra completa en
# la corrida siguiente).
#
# SIN "schedule =>" A PROPÓSITO: en este sitio (y en el resto de los ~29
# pipelines ya existentes en Configfile\, ver ext_sm1report-sito-vw.conf como
# referencia) la convención NO es un Logstash de larga duración con cron
# interno — es un .bat con `CALL logstash.bat -f este.conf` disparado por una
# Tarea Programada de Windows cada una hora. El jdbc input sin `schedule =>`
# corre la query una sola vez y el proceso termina solo apenas Logstash
# despacha el batch — si le dejáramos un `schedule =>` acá, el proceso nunca
# devolvería el control al `.bat` (se quedaría esperando su propio próximo
# disparo interno en vez de salir), rompiendo el patrón de esta instalación.
#
# Conexión: mismos valores reales que ya usan los demás .conf de este
# servidor (ver ext_sm1report-sito-vw.conf) — jdbc_driver_library queda
# comentado porque el driver ya está en el classpath de esta instalación.
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "jdbc:sqlserver://SRVDB-ESTENSA;databaseName=ExtensaRadio;user=sa;password=<PASSWORD>;"
    jdbc_user               => "sa"
    jdbc_password           => "<PASSWORD>"
    #jdbc_driver_library    => "C:\ElasticStack\sqljdbc42.jar"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    statement => "
      DECLARE @EndDate   DATETIME = DATEADD(hour, DATEDIFF(hour, 0, GETDATE()), 0);
      DECLARE @StartDate DATETIME = DATEADD(hour, -1, @EndDate);

      SELECT
          ISNULL(e.[Description], 'Unknown')       AS equipo,
          ISNULL(e.[AETitle], '')                  AS aet,
          ISNULL(e.[DICOMModalityCode], '')         AS mod,
          @StartDate                                AS hour_start,
          SUM(CASE WHEN t.[CreatedOn] >= @StartDate AND t.[CreatedOn] < @EndDate THEN 1 ELSE 0 END) AS totales,
          SUM(CASE WHEN t.[PlanningDate] >= @StartDate AND t.[PlanningDate] < @EndDate AND t.[IsPlanned] = 1 THEN 1 ELSE 0 END) AS citados,
          SUM(CASE WHEN t.[AdmissionDate] >= @StartDate AND t.[AdmissionDate] < @EndDate AND t.[IsAdmitted] = 1 THEN 1 ELSE 0 END) AS admitidos,
          SUM(CASE WHEN t.[ExecutionDate] >= @StartDate AND t.[ExecutionDate] < @EndDate AND t.[IsExecuted] = 1 THEN 1 ELSE 0 END) AS ejecutados,
          SUM(
              CASE
                  WHEN t.[ExecutionDate] >= @StartDate AND t.[ExecutionDate] < @EndDate AND t.[ImageAvailability] = 1 THEN 1
                  WHEN t.[ExecutionDate] IS NULL AND t.[AdmissionDate] >= @StartDate AND t.[AdmissionDate] < @EndDate AND t.[ImageAvailability] = 1 THEN 1
                  ELSE 0
              END
          ) AS con_imagen,
          SUM(CASE WHEN t.[ReportDate] >= @StartDate AND t.[ReportDate] < @EndDate AND t.[IsReported] = 1 THEN 1 ELSE 0 END) AS borradores,
          SUM(CASE WHEN t.[ApprovalDate] >= @StartDate AND t.[ApprovalDate] < @EndDate AND t.[IsApproved] = 1 THEN 1 ELSE 0 END) AS definitivos,
          SUM(
              CASE
                  WHEN COALESCE(t.[ExecutionDate], t.[AdmissionDate], t.[CreatedOn]) >= @StartDate
                   AND COALESCE(t.[ExecutionDate], t.[AdmissionDate], t.[CreatedOn]) < @EndDate
                   AND t.[IsSuspended] = 1 THEN 1
                  ELSE 0
              END
          ) AS suspendidos
      FROM [ExtensaRadio].[ExtRadio].[tbExamination] t WITH(NOLOCK)
      INNER JOIN [ExtensaRadio].[ExtRadio].[lsEquipment] e WITH(NOLOCK) ON t.[IdEquipment] = e.[Guid]
      WHERE
          (t.[CreatedOn] >= @StartDate AND t.[CreatedOn] < @EndDate)
          OR (t.[PlanningDate] >= @StartDate AND t.[PlanningDate] < @EndDate)
          OR (t.[AdmissionDate] >= @StartDate AND t.[AdmissionDate] < @EndDate)
          OR (t.[ExecutionDate] >= @StartDate AND t.[ExecutionDate] < @EndDate)
          OR (t.[ReportDate] >= @StartDate AND t.[ReportDate] < @EndDate)
          OR (t.[ApprovalDate] >= @StartDate AND t.[ApprovalDate] < @EndDate)
          OR (t.[ModifiedOn] >= @StartDate AND t.[ModifiedOn] < @EndDate)
      GROUP BY e.[Description], e.[AETitle], e.[DICOMModalityCode]
    "

    # No usamos el tracking incremental nativo de Logstash (sql_last_value):
    # la ventana sale de GETDATE() en la propia query, no de la última
    # corrida. El checkpoint real vive del lado del agente (.sql_checkpoint),
    # que decide qué horas ya sumó — acá solo importa que cada hora se
    # publique una sola vez con el mismo document_id (ver output).
    use_column_value => false
    tracking_column_type => "timestamp"
  }
}

filter {
  # Documento determinístico por equipo+aet+mod+hora: si esta corrida se
  # repite (reinicio de Logstash, reintento), pisa el mismo documento en vez
  # de duplicar — mismo criterio que document_id => "%{idrule}" en
  # ext_dicom_queues.conf.
  fingerprint {
    source => ["equipo", "aet", "mod", "hour_start"]
    target => "[@metadata][doc_id]"
    method => "SHA1"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts       => ["http://<ELASTIC_HOST>:29200"]   # mismo cluster que usan los demás .conf de este servidor
    user        => "logstash_import"
    password    => "logstash_import"
    index       => "ext_ris_metrics_hourly"
    document_id => "%{[@metadata][doc_id]}"
  }
}

# ---------------------------------------------------------------------------
# ext_dicom_queues.conf
#
# Autoenrute DICOM — estado de las reglas de enrutado, leído después por
# agent_logic.get_dicom_routing_queues(). El SELECT de acá está confirmado
# contra una instalación real ya en producción en otro hospital (mismas
# columnas que espera el agente: idrule, fromnode_key/nickname/hostname,
# tonode_key/nickname/hostname, pending_instances — Logstash lowercasea los
# nombres de columna por defecto).
#
# Adaptado a este hospital en dos puntos respecto de esa referencia:
#   1. Conexión: host/usuario reales de este sitio (ver ext_ris_metrics.conf
#      y hermanos) en vez de los de la referencia.
#   2. SIN `schedule =>`: la referencia corre como proceso persistente con
#      cron interno (`*/5 * * * *`), pero en este hospital se decidió seguir
#      la misma convención que ya usan los demás ~29 pipelines de
#      Configfile\ — un solo ciclo por invocación, repetido por una Tarea
#      Programada de Windows sobre ext_tiempo_real-all-sito.bat (cajón de
#      cadencia "cada 5 minutos" — igual cadencia que el schedule original).
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "jdbc:sqlserver://SRVDB-ESTENSA;databaseName=ExtensaPACS;user=sa;password=<PASSWORD>;"
    jdbc_user               => "sa"
    jdbc_password           => "<PASSWORD>"
    #jdbc_driver_library    => "C:\ElasticStack\sqljdbc42.jar"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    statement => "SELECT
    r.[IDRULE],
    r.[FROMNODE] AS [FROMNODE_KEY],
    c_from.[NICKNAME] AS [FROMNODE_NICKNAME],
    c_from.[HOSTNAME] AS [FROMNODE_HOSTNAME],
    r.[TONODE] AS [TONODE_KEY],
    c_to.[NICKNAME] AS [TONODE_NICKNAME],
    c_to.[HOSTNAME] AS [TONODE_HOSTNAME],
    ISNULL(p.[PENDING_COUNT], 0) AS [PENDING_INSTANCES]
FROM [ExtensaPACS].[ExtPacs].[DICOMAUTOROUTINGRULES] r WITH (NOLOCK)
LEFT JOIN [ExtensaPACS].[ExtPacs].[DICOMCLIENT] c_from WITH (NOLOCK)
    ON r.[FROMNODE] = c_from.[CLIENT_KEY]
LEFT JOIN [ExtensaPACS].[ExtPacs].[DICOMCLIENT] c_to WITH (NOLOCK)
    ON r.[TONODE] = c_to.[CLIENT_KEY]
LEFT JOIN (
    SELECT [IDRULE], COUNT(*) AS [PENDING_COUNT]
    FROM [ExtensaPACS].[ExtPacs].[DICOMAUTOROUTINGQUEUE] WITH (NOLOCK)
    GROUP BY [IDRULE]
) p ON r.[IDRULE] = p.[IDRULE]
WHERE r.[ACTIVE] = 1"
  }
}

output {
  elasticsearch {
    hosts       => ["http://<ELASTIC_HOST>:29200"]   # mismo cluster que usan los demás .conf de este servidor
    user        => "logstash_import"
    password    => "logstash_import"
    index       => "ext_dicom_queues"
    document_id => "%{idrule}"
  }
}

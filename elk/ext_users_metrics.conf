# ---------------------------------------------------------------------------
# ext_users_metrics.conf
#
# Distinto de ext_ris_metrics.conf / ext_pacs_metrics.conf en un punto clave:
# "usuarios_unicos" es un COUNT(DISTINCT User_GUID) — NO es aditivo. Si acá
# publicáramos "cuántos únicos hubo esta hora" y el agente sumara esos
# números para reconstruir un bloque de varias horas, un mismo usuario
# logueado en dos horas distintas del bloque se contaría dos veces.
#
# Por eso este pipeline no publica un conteo: publica el ARRAY de User_GUID
# distintos que se loguearon en esa hora, por rol (user_guids). El agente
# (agent_logic.py, _sumar_horas_users) hace la UNIÓN de esos arrays a través
# de todas las horas del bloque y recién ahí cuenta cuántos son — así el
# resultado es matemáticamente igual al COUNT(DISTINCT ...) que hace hoy
# SQL Server sobre el bloque completo, sin importar en cuántos documentos
# horarios se haya repartido.
#
# NOTA DE COMPATIBILIDAD: STRING_AGG requiere SQL Server 2017+. Si el
# servidor del hospital es más viejo, reemplazar la sub-consulta de
# user_guids_csv por la variante clásica con FOR XML PATH('') + STUFF.
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "<JDBC_CONNECTION_STRING>"   # igual que ext_dicom_queues.conf
    jdbc_user               => "<JDBC_USER>"
    jdbc_password           => "<JDBC_PASSWORD>"
    jdbc_driver_library     => "<JDBC_DRIVER_LIBRARY_PATH>"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    schedule => "5 * * * *"

    statement => "
      DECLARE @EndDate   DATETIME = DATEADD(hour, DATEDIFF(hour, 0, GETDATE()), 0);
      DECLARE @StartDate DATETIME = DATEADD(hour, -1, @EndDate);

      WITH logins AS (
          SELECT
              r.[Description] AS rol,
              a.[User_GUID]    AS user_guid,
              a.[GUID]         AS audit_guid
          FROM [SL_UserAndConfig].[ExtConfig].[UserAuditHistory] a WITH(NOLOCK)
          INNER JOIN [ExtensaRadio].[ExtRadio].[tbUser] u WITH(NOLOCK) ON a.[User_GUID] = u.[Guid]
          INNER JOIN [ExtensaRadio].[ExtRadio].[lsRole] r WITH(NOLOCK) ON u.[IdRole] = r.[Guid]
          WHERE a.[CreatedOn] >= @StartDate AND a.[CreatedOn] < @EndDate AND a.[AuditText] = 'User Logon OK'
      ),
      distinct_users AS (
          SELECT DISTINCT rol, user_guid FROM logins
      )
      SELECT
          l.[rol]                                       AS rol,
          @StartDate                                     AS hour_start,
          COUNT(l.[audit_guid])                          AS inicios_sesion,
          (
              SELECT STRING_AGG(CONVERT(varchar(36), du.[user_guid]), ',')
              FROM distinct_users du
              WHERE du.[rol] = l.[rol]
          ) AS user_guids_csv
      FROM logins l
      GROUP BY l.[rol]
    "

    use_column_value => false
    tracking_column_type => "timestamp"
  }
}

filter {
  # user_guids_csv llega como "guid1,guid2,guid3" (o vacío/null si nadie se
  # logueó esa hora para ese rol) — lo convertimos a array real para que
  # el agente pueda leerlo como lista de strings desde Elasticsearch.
  if [user_guids_csv] {
    mutate {
      split => { "user_guids_csv" => "," }
      rename => { "user_guids_csv" => "user_guids" }
    }
  } else {
    mutate {
      add_field => { "user_guids" => [] }
      remove_field => ["user_guids_csv"]
    }
  }

  fingerprint {
    source => ["rol", "hour_start"]
    target => "[@metadata][doc_id]"
    method => "SHA1"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts       => ["http://172.29.232.10:29200"]
    user        => "logstash_import"
    password    => "logstash_import"
    index       => "ext_users_metrics_hourly"
    document_id => "%{[@metadata][doc_id]}"
  }
}

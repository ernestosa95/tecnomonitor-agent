# ---------------------------------------------------------------------------
# ext_sql_backups.conf
#
# Ultimo backup COMPLETO de las bases SQL Server (REQ-06, agente 4.5.3), leido despues por el
# agente (sql_backups.recolectar_elastic, indice `ext_sql_backups`).
#
# Corre cada 1 hora dentro del cajon ext_kpis_negocio-all-sito.bat (misma Tarea Programada que los
# KPIs de negocio, sin tarea nueva). La consulta es liviana: solo lee msdb.dbo.backupset.
#
# Un documento por base (`document_id` = nombre de la base): cada corrida pisa el anterior, asi el
# indice guarda siempre el ultimo estado y no crece. Una base configurada sin ningun backup
# completo sale con last_full vacio (no falta de la lista).
#
# Solo backups completos (type = 'D') y sin los "solo copia" (is_copy_only = 0). Las fechas salen
# como TEXTO en hora local del SQL (CONVERT ... 126): si fueran datetime, Logstash las pasaria a UTC.
#
# LISTA DE BASES: la misma del chequeo de integridad (ext_checkdb.conf). Si se agrega una alla,
# agregarla tambien aca. Las que no existan en el servidor se ignoran.
#
# HOST DE CONEXION: copiar el de un .conf que ya funcione en ESTE hospital (en P03 es localhost,
# porque Logstash y SQL Server corren en la misma VM). No dejar un nombre de ejemplo.
#
# REGLAS PARA EDITAR EL STATEMENT (Logstash procesa este texto antes de mandarlo a SQL Server)
#   - Comentarios SOLO con /* ... */ (nunca con dos guiones).
#   - Sin comillas dobles ni la secuencia "${".
#   - Sin dos puntos.
#
# SIN "schedule =>" A PROPOSITO, igual que el resto de los pipelines de este servidor: un ciclo por
# invocacion, repetido por la Tarea Programada. Sin seguimiento (use_column_value): siempre trae
# el estado completo.
# ---------------------------------------------------------------------------

input {
  jdbc {
    jdbc_connection_string => "jdbc:sqlserver://localhost;databaseName=master;user=sa;password=<PASSWORD>;"
    jdbc_user               => "sa"
    jdbc_password           => "<PASSWORD>"
    #jdbc_driver_library    => "C:\ElasticStack\sqljdbc42.jar"
    jdbc_driver_class       => "com.microsoft.sqlserver.jdbc.SQLServerDriver"

    statement => "
SET NOCOUNT ON;

/* ============================ CONFIGURACION ============================ */
DECLARE @Bases TABLE (nombre SYSNAME);
INSERT INTO @Bases (nombre) VALUES
    (N'AspnetDB'), (N'DBScheduler'), (N'DicomedBroker'), (N'DicomedBrokerStorico'), (N'DICOMedP@CS'),
    (N'ExtensaAnalytics'), (N'ExtensaCardio'), (N'ExtensaConnect'), (N'ExtensaCustomPage'),
    (N'ExtensaDataExport'), (N'ExtensaGeneric'), (N'ExtensaHistory'), (N'ExtensaIntegration'),
    (N'ExtensaIntegrationGateway'), (N'ExtensaMPS'), (N'ExtensaPACS'), (N'ExtensaPatient'),
    (N'ExtensaPublication'), (N'ExtensaRadio'), (N'ExtensaRT'), (N'ExtensaVNA'), (N'ExtensaWarehouse'),
    (N'eXtensaWRK'), (N'MediaProducerDB'), (N'SL_UserAndConfig'), (N'support');
/* ======================================================================= */

SELECT
    d.name                                                 AS dbname,
    CONVERT(VARCHAR(19), MAX(bk.backup_finish_date), 126)  AS last_full,
    CONVERT(VARCHAR(19), GETDATE(), 126)                   AS checked_at
FROM sys.databases d
JOIN @Bases b ON b.nombre COLLATE DATABASE_DEFAULT = d.name COLLATE DATABASE_DEFAULT
LEFT JOIN msdb.dbo.backupset bk
       ON bk.database_name COLLATE DATABASE_DEFAULT = d.name COLLATE DATABASE_DEFAULT
      AND bk.type = 'D'
      AND bk.is_copy_only = 0
GROUP BY d.name;
"
  }
}

output {
  elasticsearch {
    hosts       => ["http://<ELASTIC_HOST>:29200"]   # mismo cluster que usan los demas .conf de este servidor
    user        => "logstash_import"
    password    => "logstash_import"
    index       => "ext_sql_backups"
    # Un documento por base: cada corrida pisa el estado anterior.
    document_id => "%{dbname}"
  }
}
